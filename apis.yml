name: Loa Healthcare Pricing API
description: Source-labeled U.S. healthcare price transparency API and MCP server. Provides hospital and provider
  entity search, source-labeled price rows, cross-entity price comparison by CPT/HCPCS, and a reviewed update-submission
  workflow. Data comes from 6,000+ hospital Machine Readable Files under the federal Hospital Price Transparency
  Rule plus CMS NPI Registry and Loa-reviewed provider submissions.
